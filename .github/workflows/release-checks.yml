name: Release checks
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-packages:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Offline, emulator and browser verification
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Packages, symbols, API guards and isolated consumers
        shell: pwsh
        run: ./scripts/verify-release.ps1 -SkipNativeBuild -ConsumerFrameworks net8.0,net9.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages-and-receipts
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/release-manifest-*.json
            artifacts/packages/consumer-*.json
          if-no-files-found: warn
